name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build release
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          mkdir -p saaga-social-flow
          cp target/${{ matrix.target }}/release/saaga-social-flow saaga-social-flow/
          cp README.md saaga-social-flow/
          cp LICENSE saaga-social-flow/ 2>/dev/null || true
          tar -czf saaga-social-flow-${{ matrix.target }}.tar.gz saaga-social-flow/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: saaga-social-flow-${{ matrix.target }}
          path: saaga-social-flow-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            saaga-social-flow-x86_64-apple-darwin/saaga-social-flow-x86_64-apple-darwin.tar.gz
            saaga-social-flow-aarch64-apple-darwin/saaga-social-flow-aarch64-apple-darwin.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
