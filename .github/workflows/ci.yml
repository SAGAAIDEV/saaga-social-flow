name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test and lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # The cut, the transcode and the waveform all shell out to ffmpeg, and
      # their tests run the real binary. The runner image does not carry it.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Run tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    # The audit reports as a check run, and the default token is read-only:
    # without this it finds nothing and still fails, unable to post the result.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The same list, with the reasons, is in .cargo/audit.toml.
          ignore: RUSTSEC-2026-0258,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104
