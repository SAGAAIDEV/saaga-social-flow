<!DOCTYPE html>
<html lang="en" data-composition-variables="[

  <body>
    <template>
      <div data-hf-id="hf-cpt0" id="root" data-composition-id="chapter-title-card" data-start="0" data-width="1920" data-height="1080" data-duration="3">
        <style>
          @font-face {
            font-family: 'Booton';

            font-weight: 500; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Semibold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Heavy.woff2') format('woff2');

            font-style: normal;
            font-display: block;
          }
          #root {
            --chapter-accent: var(--accentColor, var(--saaga-orange));
            --chapter-text: var(--textColor, var(--saaga-ink));
            /* SAAGA video theme — see components/design.md.
               Kept inside the template so compiler scoping preserves it. */
            --saaga-ink: #1d1d1d;
            --saaga-paper: #f6f6f6;
            --saaga-muted: #626262;
            --saaga-orange: #eb5201;
            --saaga-peach: #ffeee5;
            --saaga-line: #d1d1cc;
            --saaga-orange-on-dark: #ff9561;
            --saaga-radius: 24px;
            color: var(--saaga-ink);
            font-weight: 500;
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Booton', system-ui, sans-serif;
          }
          .ctc-scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }
          /* Figma "Chapter Card", HorizontalDemo (node 67:988): white, with two
             peach arcs sweeping in from the left behind the type. */
          .ctc-bg {
            position: absolute;
            inset: 0;
            background: var(--backgroundColor, #ffffff);
          }
          .ctc-arc {
            position: absolute;
            left: 0;
            top: 0.13px;
            height: 1079.82px;
          }
          .ctc-arc-outer { width: 1671.67px; }
          .ctc-arc-inner { width: 1368.21px; }
          /* Left-aligned at the design's 122px inset and lifted 77px above
             centre, as drawn; a longer title wraps downward from there. */
          .ctc-content {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0 154px 122px;
          }
          /* chapter-style:start */
          /* Shared chapter typography. Embedded into each template by sync-chapters.mjs;
             no stylesheet fetch is required in generated render workspaces.
             Figma: "Video Layouts and Thumbnails", Chapter Card section (node 67:987).
             Defaults are the landscape card; portrait templates override the sizes. */
          .chapter-heading {
            box-sizing: border-box;
            width: 100%;
            max-width: var(--chapter-width, 1000px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--chapter-gap, 33px);
            text-align: left;
            color: var(--chapter-text, var(--saaga-ink));
          }
          /* CHAPTER over the number, centred on it, the pair left-aligned as a block. */
          .chapter-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--chapter-meta-gap, 16px);
          }
          .chapter-label {
            color: var(--chapter-muted, #555554);
            font-size: var(--chapter-label-size, 41px);
            font-weight: 500;
            line-height: normal;
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .chapter-number {

            width: var(--chapter-rule-width, 392px);
            max-width: 100%;
          }
          .chapter-rule {

            width: 100%;
            height: var(--chapter-rule-weight, 2px);
            background: var(--chapter-accent, var(--saaga-orange));
            transform-origin: left center;

          .chapter-topic {
            margin: 0;
            max-width: 100%;
            color: var(--chapter-text, var(--saaga-ink));
            font-size: var(--chapter-title-size, 107px);
            font-weight: 700;
            line-height: 1.11;
            overflow-wrap: anywhere;
            text-wrap: balance;
          }
          .chapter-topic:empty { display: none; }
          /* The chapter surface shared by the footage openers: the card's own layout,
             on the orientation's surface. The existing plate exit carries the surface
             and its type away together. */
          .chapter-heading.chapter-opener {
            max-width: none;
            height: 100%;
            padding: var(--chapter-padding, 0 0 154px 122px);
            justify-content: center;
            background: var(--chapter-surface, #fdeee6);
          }
          .chapter-heading.chapter-opener > * { max-width: var(--chapter-width, 1000px); }
          /* The outline card's heading (Figma "Topic Card", option 2): the number and
             label in one orange-outlined pill, then the title with a short rule under
             it. Flex order puts the rule after the title without a second markup. */
          .chapter-heading.chapter-pill { gap: 0; }
          .chapter-pill .chapter-meta {
            flex-direction: row-reverse;
            gap: var(--chapter-pill-gap, 16px);
            padding: 0 var(--chapter-pill-pad, 28px);
            border: var(--chapter-pill-border, 1px) solid var(--chapter-accent, var(--saaga-orange));
            border-radius: 999px;
            margin-bottom: var(--chapter-pill-after, 58px);
          }
          .chapter-pill .chapter-label {
            font-size: var(--chapter-label-size, 45px);
            font-weight: 600;
          }

          .chapter-pill .chapter-signature {

            margin-top: var(--chapter-rule-before, 22px);
          }
          /* chapter-style:end */
        </style>

        <!-- A silent track, not decoration. `render` rejects an output with no
             audio stream, and the long form is assembled by concatenating these
             segments — the concat demuxer needs every segment to carry the same
             streams, so a card without audio would break the join. -->
        <audio data-hf-id="hf-cptaud" id="chapter-title-card-audio" data-start="0" data-duration="3" data-track-index="8" src="assets/silence.mp3" data-volume="0"></audio>

        <section data-hf-id="hf-cpt1" id="chapter-title-card-scene" class="ctc-scene clip" data-start="0" data-duration="3" data-track-index="0">
          <div data-hf-id="hf-cpt2" id="chapter-title-card-bg" class="ctc-bg">
            <img data-hf-id="hf-cptarco" id="chapter-title-card-arc-outer" class="ctc-arc ctc-arc-outer" src="assets/chapter-arc-outer.svg" alt="">
            <img data-hf-id="hf-cptarci" id="chapter-title-card-arc-inner" class="ctc-arc ctc-arc-inner" src="assets/chapter-arc-inner.svg" alt="">
          </div>
          <div data-hf-id="hf-cpt4" id="chapter-title-card-content" class="ctc-content">

              <div id="chapter-title-card-meta" class="chapter-meta">

                <div data-hf-id="hf-cpt6" id="chapter-title-card-number" class="chapter-number" data-var-text="chapterNumber">01</div>
              </div>
              <div data-hf-id="hf-cpt7" id="chapter-title-card-separator" class="chapter-signature" aria-hidden="true">
                <span data-hf-id="hf-cpt8" id="chapter-title-card-line-left" class="chapter-rule"></span>
              </div>
              <div data-hf-id="hf-cptb" id="chapter-title-card-topic" class="chapter-topic" data-var-text="chapterTopic">The New Workflow</div>
            </div>
          </div>
        </section>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });
            /* chapter-motion:start */
            /* Embedded inside each template's IIFE; no globals or extra timelines.
               Selectors are passed explicitly so instances keep their own scoped targets. */
            function addChapterMotion(tl, options) {
              var elements = [options.meta, options.title, options.signature];
              if (options.animateIn) {
                // Even a one-second card completes its entrance with time left to read.
                var beat = Math.min(1, options.duration / 1.8);
                tl.fromTo(options.meta,
                  { autoAlpha: 0, y: 14 },
                  { autoAlpha: 1, y: 0, duration: 0.36 * beat, ease: 'power3.out' },
                  0.04 * beat);
                // The rule sits between the number and the title, so it draws first and
                // the title rises in beneath it.
                tl.fromTo(options.signature,
                  { autoAlpha: 0, y: 0 },
                  { autoAlpha: 1, y: 0, duration: 0.3 * beat, ease: 'power2.out' },
                  0.12 * beat);
                tl.fromTo(options.rule,
                  { scaleX: 0 },
                  { scaleX: 1, duration: 0.48 * beat, ease: 'power3.out' },
                  0.12 * beat);
                tl.fromTo(options.title,
                  { autoAlpha: 0, y: 28 },
                  { autoAlpha: 1, y: 0, duration: 0.5 * beat, ease: 'power3.out' },
                  0.2 * beat);
              } else {
                // Footage openers and holdFromStart cards remain readable in frame zero.
                tl.set(elements, { autoAlpha: 1, y: 0 }, 0);
                tl.set(options.rule, { scaleX: 1 }, 0);
              }
              if (typeof options.exitAt === 'number') {
                tl.fromTo(options.plate,
                  { autoAlpha: 1, y: 0 },
                  { autoAlpha: 0, y: -24, duration: options.exitDuration,
                    ease: 'power2.in', immediateRender: false },
                  options.exitAt);
              }
            }
            /* chapter-motion:end */
            var vars = (window.__hyperframes && window.__hyperframes.getVariables)
              ? window.__hyperframes.getVariables() : {};

            /* Every timed element takes the card's length, or its hardcoded
               duration ends the clip early and the frame goes blank. */
            var D = Number(vars.durationSeconds);
            if (!isFinite(D) || D < 1 || D > 15) { D = 3; }
            ['chapter-title-card-scene', 'chapter-title-card-audio'].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) { el.setAttribute('data-duration', String(D)); }
            });

            /* Card entrances settle early; the composed first frame is retained
               when explicitly requested. The finished card holds until the cut. */
            addChapterMotion(tl, {
              duration: D,
              animateIn: Number(vars.holdFromStart) !== 1,
              meta: '#chapter-title-card-meta',
              title: '#chapter-title-card-topic',
              signature: '#chapter-title-card-separator',
              rule: '#chapter-title-card-line-left'
            });

            tl.seek(0);
            window.__timelines['chapter-title-card'] = tl;
          })();
        </script>
      </div>
