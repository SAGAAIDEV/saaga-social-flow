<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;chapterLabel&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Label&quot;,&quot;default&quot;:&quot;Chapter&quot;,&quot;maxLength&quot;:24},
    {&quot;id&quot;:&quot;chapterNumber&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Number&quot;,&quot;default&quot;:&quot;01&quot;,&quot;maxLength&quot;:4},
    {&quot;id&quot;:&quot;chapterTopic&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Topic&quot;,&quot;default&quot;:&quot;The New Workflow&quot;,&quot;maxLength&quot;:80},
    {&quot;id&quot;:&quot;accentColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Accent Color&quot;,&quot;default&quot;:&quot;#EB5201&quot;},
    {&quot;id&quot;:&quot;backgroundColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Background Color&quot;,&quot;default&quot;:&quot;#1D1D1D&quot;},
    {&quot;id&quot;:&quot;textColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Text Color&quot;,&quot;default&quot;:&quot;#F6F6F6&quot;},
    {&quot;id&quot;:&quot;durationSeconds&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Card Duration&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:15,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;},
    {&quot;id&quot;:&quot;holdFromStart&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Composed From Frame One&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:1}
  ]">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <div data-hf-id="hf-cpt0" id="root" data-composition-id="chapter-title-card" data-start="0" data-width="1920" data-height="1080" data-duration="3">
        <style>
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Semibold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: block;
          }
          #root {
            --chapter-width: 1440px;
            --chapter-title-size: 112px;
            --chapter-accent: var(--accentColor, var(--saaga-orange));
            --chapter-text: var(--textColor, var(--saaga-paper));
            /* SAAGA video theme — see components/design.md.
               Kept inside the template so compiler scoping preserves it. */
            --saaga-ink: #1d1d1d;
            --saaga-paper: #f6f6f6;
            --saaga-muted: #626262;
            --saaga-orange: #eb5201;
            --saaga-peach: #ffeee5;
            --saaga-line: #d1d1cc;
            --saaga-orange-on-dark: #ff9561;
            --saaga-radius: 24px;
            color: var(--saaga-ink);
            font-weight: 500;
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: 'Booton', system-ui, sans-serif;
          }
          .ctc-scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }
          .ctc-bg {
            position: absolute;
            inset: 0;
            background: var(--backgroundColor, var(--saaga-ink));
          }
          .ctc-content {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 96px 144px;
          }
          /* chapter-style:start */
          /* Shared chapter typography. Embedded into each template by sync-chapters.mjs;
             no stylesheet fetch is required in generated render workspaces. */
          .chapter-heading {
            box-sizing: border-box;
            width: 100%;
            max-width: var(--chapter-width, 1440px);
            text-align: left;
            color: var(--chapter-text, var(--saaga-paper));
          }
          .chapter-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            color: var(--chapter-accent, var(--saaga-orange-on-dark));
          }
          .chapter-label {
            font-size: 28px;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .chapter-number {
            flex: none;
            box-sizing: border-box;
            min-width: 68px;
            padding: 9px 16px;
            border: 1px solid currentColor;
            border-radius: 10px;
            font-size: 30px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: -0.02em;
            text-align: center;
          }
          .chapter-topic {
            margin: 0;
            max-width: 100%;
            color: var(--chapter-text, var(--saaga-paper));
            font-size: var(--chapter-title-size, 112px);
            font-weight: 600;
            line-height: 1.06;
            letter-spacing: -0.045em;
            overflow-wrap: anywhere;
            text-wrap: balance;
          }
          .chapter-topic:empty { display: none; }
          .chapter-signature {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            margin-top: 42px;
          }
          .chapter-rule {
            display: block;
            width: 96px;
            height: 3px;
            background: var(--chapter-accent, var(--saaga-orange-on-dark));
            transform-origin: left center;
          }
          .chapter-mark {
            display: block;
            width: 36px;
            height: 36px;
            flex: none;
          }
          /* chapter-style:end */
        </style>

        <!-- A silent track, not decoration. `render` rejects an output with no
             audio stream, and the long form is assembled by concatenating these
             segments — the concat demuxer needs every segment to carry the same
             streams, so a card without audio would break the join. -->
        <audio data-hf-id="hf-cptaud" id="chapter-title-card-audio" data-start="0" data-duration="3" data-track-index="8" src="assets/silence.mp3" data-volume="0"></audio>

        <section data-hf-id="hf-cpt1" id="chapter-title-card-scene" class="ctc-scene clip" data-start="0" data-duration="3" data-track-index="0">
          <div data-hf-id="hf-cpt2" id="chapter-title-card-bg" class="ctc-bg"></div>
          <div data-hf-id="hf-cpt4" id="chapter-title-card-content" class="ctc-content">
            <div id="chapter-title-card-heading" class="chapter-heading">
              <div id="chapter-title-card-meta" class="chapter-meta">
                <div data-hf-id="hf-cpt5" id="chapter-title-card-label" class="chapter-label" data-var-text="chapterLabel">Chapter</div>
                <div data-hf-id="hf-cpt6" id="chapter-title-card-number" class="chapter-number" data-var-text="chapterNumber">01</div>
              </div>
              <div data-hf-id="hf-cptb" id="chapter-title-card-topic" class="chapter-topic" data-var-text="chapterTopic">The New Workflow</div>
              <div data-hf-id="hf-cpt7" id="chapter-title-card-separator" class="chapter-signature" aria-hidden="true">
                <span data-hf-id="hf-cpt8" id="chapter-title-card-line-left" class="chapter-rule"></span>
                <img data-hf-id="hf-cpt9" id="chapter-title-card-separator-mark" class="chapter-mark" src="assets/badge.svg" alt="">
              </div>
            </div>
          </div>
        </section>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });
            /* chapter-motion:start */
            /* Embedded inside each template's IIFE; no globals or extra timelines.
               Selectors are passed explicitly so instances keep their own scoped targets. */
            function addChapterMotion(tl, options) {
              var elements = [options.meta, options.title, options.signature];
              if (options.animateIn) {
                // Even a one-second card completes its entrance with time left to read.
                var beat = Math.min(1, options.duration / 1.8);
                tl.fromTo(options.meta,
                  { autoAlpha: 0, y: 14 },
                  { autoAlpha: 1, y: 0, duration: 0.36 * beat, ease: 'power3.out' },
                  0.04 * beat);
                tl.fromTo(options.title,
                  { autoAlpha: 0, y: 28 },
                  { autoAlpha: 1, y: 0, duration: 0.5 * beat, ease: 'power3.out' },
                  0.12 * beat);
                tl.fromTo(options.signature,
                  { autoAlpha: 0, y: 0 },
                  { autoAlpha: 1, y: 0, duration: 0.3 * beat, ease: 'power2.out' },
                  0.22 * beat);
                tl.fromTo(options.rule,
                  { scaleX: 0 },
                  { scaleX: 1, duration: 0.48 * beat, ease: 'power3.out' },
                  0.22 * beat);
              } else {
                // Footage openers and holdFromStart cards remain readable in frame zero.
                tl.set(elements, { autoAlpha: 1, y: 0 }, 0);
                tl.set(options.rule, { scaleX: 1 }, 0);
              }
              if (typeof options.exitAt === 'number') {
                tl.fromTo(options.plate,
                  { autoAlpha: 1, y: 0 },
                  { autoAlpha: 0, y: -24, duration: options.exitDuration,
                    ease: 'power2.in', immediateRender: false },
                  options.exitAt);
              }
            }
            /* chapter-motion:end */
            var vars = (window.__hyperframes && window.__hyperframes.getVariables)
              ? window.__hyperframes.getVariables() : {};

            /* Every timed element takes the card's length, or its hardcoded
               duration ends the clip early and the frame goes blank. */
            var D = Number(vars.durationSeconds);
            if (!isFinite(D) || D < 1 || D > 15) { D = 3; }
            ['chapter-title-card-scene', 'chapter-title-card-audio'].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) { el.setAttribute('data-duration', String(D)); }
            });

            /* Card entrances settle early; the composed first frame is retained
               when explicitly requested. The finished card holds until the cut. */
            addChapterMotion(tl, {
              duration: D,
              animateIn: Number(vars.holdFromStart) !== 1,
              meta: '#chapter-title-card-meta',
              title: '#chapter-title-card-topic',
              signature: '#chapter-title-card-separator',
              rule: '#chapter-title-card-line-left'
            });

            tl.seek(0);
            window.__timelines['chapter-title-card'] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
