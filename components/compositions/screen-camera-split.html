        <style>
          /* Brand font. Vendored as woff2 under assets/fonts so renders are
             deterministic and do not depend on a system-installed copy. */
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: block;

            font-weight: 600; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Bold.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: block;
          }
          #root {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Booton', Inter, system-ui, sans-serif;
          }
          /* Figma paint order: background -> camera -> screen -> name label.
             The screen render sits on top and covers the camera's left edge, so the
             camera reads as a flush column from x=1402.56 to the frame edge.

             In Figma the camera art starts at y=254.74, but that asset is a cutout
             portrait whose own backdrop is the same #fdeee6 as the background rect —
             so the column reads as continuous from y=0 (verified: no seam at y=255).
             A real camera movie has no such backdrop, so the camera fills the full
             column height here. Its 10px top corner radii are dropped for the same
             reason: in Figma both corners are occluded/off-canvas and never render. */
          .screen-camera-split-bg {
            position: absolute;
            inset: 0;
            background: #fdeee6;
            z-index: 0;
          }
          /* Runs a few px under the screen render so the two never leave a
             sub-pixel seam; the screen's right edge (1402.56) is the visible join. */
          .screen-camera-split-camera-wrap {
            position: absolute;
            left: 1398px;
            top: 0;
            width: 522px;
            height: 1080px;
            overflow: hidden;
            z-index: 1;
          }
          .screen-camera-split-camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: var(--cameraPosition, center);
          }
          .screen-camera-split-screen {
            position: absolute;
            left: 0;
            top: 0;
            width: 1402.562px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
          }
          .screen-camera-split-name {
            position: absolute;
            left: 1403px;
            top: 1003px;
            width: 517px;
            height: 77px;
            box-sizing: border-box;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            overflow: hidden;   /* carousel window: items clip as they roll through */
            z-index: 3;
          }
          /* Identity strip: speaker name alternates with the animated logo lockup.
             Both layers stack in the same bar and cross-fade. */
          .scs-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });
            var vars = (window.__hyperframes && window.__hyperframes.getVariables)
              ? window.__hyperframes.getVariables() : {};

            /* Every timed element takes the chapter's length. Miss one and that clip
               ends early, blanking part of the frame partway through. */
            var D = Number(vars.durationSeconds);
            if (!isFinite(D) || D < 1 || D > 900) { D = 10; }
            ['screen-camera-split-bg', 'screen-camera-split-camera-video',
             'screen-camera-split-screen-video', 'screen-camera-split-name',
             'screen-camera-split-audio'].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) { el.setAttribute('data-duration', String(D)); }
            });

            /* No transform on the media regions: they are flush to the frame edges,
               so any translate/scale would expose the background behind them. */
            tl.fromTo(
              '#screen-camera-split-name-text',
              { autoAlpha: 0, y: 8 },
              { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' },
              0.2
            );

            /* Badge rings: badge.svg drives these with CSS `animation: ... infinite`,
               which is wall-clock and cannot be seeked. Re-expressed as finite GSAP
               tweens on the paused timeline so every frame is reproducible.
               svgOrigin values are the transform-origins from badge.svg's stylesheet. */
            tl.to('#scs-badge-small',  { rotation:  360, duration: 4, ease: 'none', repeat: 14, svgOrigin: '10.07 10.07' }, 0);
            tl.to('#scs-badge-medium', { rotation: -360, duration: 4, ease: 'none', repeat: 14, svgOrigin: '10.07 10.07' }, 0);
            tl.to('#scs-badge-orbit',  { rotation:  360, duration: 8, ease: 'none', repeat:  7, svgOrigin: '10.07 10.07' }, 0);
            tl.to('#scs-badge-dashed', { rotation: -360, duration: 5, ease: 'none', repeat: 11, svgOrigin: '7.3 11'     }, 0);

            /* Alternation reads as a vertical carousel: every item travels DOWNWARD.
               The outgoing item falls out of the bar while the incoming one drops in
               from above, so the pair moves as one continuous reel.

               Exactly a 5s loop. Both the in- and out-roll for an item sit INSIDE the
               cycle (item drops in at t=0, rolls out before t=5) so the repeat seam is
               invisible and nothing is mid-flight when the cycle wraps. Finite repeat —
               no infinite tween, so every frame is reproducible under seek. */
            var NAME = '#screen-camera-split-name-text';
            var LOGO = '#screen-camera-split-idty-logo';
            var ROLL = 46;                       /* travel in px; > half the 77px bar so items fully clear */
            var IN   = { duration: 0.55, ease: 'power3.out' };
            var OUT  = { duration: 0.40, ease: 'power2.in' };

            var idty = gsap.timeline({ repeat: 19 });   /* 19 repeats = 100s of cover */
            idty.set(NAME, { autoAlpha: 0, y: -ROLL }, 0)
                .set(LOGO, { autoAlpha: 0, y: -ROLL }, 0)
                .to(NAME, Object.assign({ y: 0,    autoAlpha: 1 }, IN),  0.00)   /* name drops in   */
                .to(NAME, Object.assign({ y: ROLL, autoAlpha: 0 }, OUT), 2.30)   /* name rolls out  */
                .to(LOGO, Object.assign({ y: 0,    autoAlpha: 1 }, IN),  2.40)   /* logo drops in   */
                .to(LOGO, Object.assign({ y: ROLL, autoAlpha: 0 }, OUT), 4.60);  /* logo rolls out  */
            /* cycle length = 4.60 + 0.40 = exactly 5.00s */
            tl.add(idty, 0);
            window.__timelines['screen-camera-split'] = tl;
          })();
