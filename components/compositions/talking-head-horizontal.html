<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;cameraSrc&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Camera Movie&quot;,&quot;default&quot;:&quot;assets/placeholder-camera.mp4&quot;},
    {&quot;id&quot;:&quot;cameraPosition&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Camera Framing (CSS object-position)&quot;,&quot;default&quot;:&quot;center&quot;},
    {&quot;id&quot;:&quot;chapterLabel&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Label&quot;,&quot;default&quot;:&quot;Chapter&quot;,&quot;maxLength&quot;:24},
    {&quot;id&quot;:&quot;chapterNumber&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Number&quot;,&quot;default&quot;:&quot;01&quot;,&quot;maxLength&quot;:4},
    {&quot;id&quot;:&quot;chapterTopic&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Topic&quot;,&quot;default&quot;:&quot;The New Workflow&quot;,&quot;maxLength&quot;:80},
    {&quot;id&quot;:&quot;openerSeconds&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Chapter Opener Length&quot;,&quot;default&quot;:2.6,&quot;min&quot;:1.2,&quot;max&quot;:6,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;},
    {&quot;id&quot;:&quot;audioSrc&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Chapter Audio&quot;,&quot;default&quot;:&quot;assets/placeholder-audio.mp3&quot;},
    {&quot;id&quot;:&quot;durationSeconds&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Chapter Duration&quot;,&quot;default&quot;:10,&quot;min&quot;:1,&quot;max&quot;:900,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <div data-hf-id="hf-thhrt" id="root" data-composition-id="talking-head-horizontal" data-start="0" data-width="1920" data-height="1080" data-duration="10">
        <style>
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Medium.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Semibold.woff2') format('woff2');
            font-weight: 600; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Bold.woff2') format('woff2');
            font-weight: 700; font-style: normal; font-display: block;
          }
          @font-face {
            font-family: 'Booton';
            src: url('assets/fonts/Booton-Heavy.woff2') format('woff2');
            font-weight: 800; font-style: normal; font-display: block;
          }
          #root {
            /* The chapter card's surface, so the opener reads as the card. */
            --chapter-surface: url('assets/chapter-arc-inner.svg') 0 0.13px / 1368.21px 1079.82px no-repeat,
              url('assets/chapter-arc-outer.svg') 0 0.13px / 1671.67px 1079.82px no-repeat, #ffffff;
            --chapter-accent: var(--saaga-orange);
            --chapter-text: var(--saaga-ink);
            /* SAAGA video theme — see components/design.md.
               Kept inside the template so compiler scoping preserves it. */
            --saaga-ink: #1d1d1d;
            --saaga-paper: #f6f6f6;
            --saaga-muted: #626262;
            --saaga-orange: #eb5201;
            --saaga-peach: #ffeee5;
            --saaga-line: #d1d1cc;
            --saaga-orange-on-dark: #ff9561;
            --saaga-radius: 24px;
            color: var(--saaga-ink);
            font-weight: 500;
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: var(--saaga-paper);
            font-family: 'Booton', system-ui, sans-serif;
          }
          /* The landscape counterpart to talking-head-vertical: the camera is the
             whole frame, no screen, no name bar.

             Media/frame classes stay prefixed. Chapter typography and motion
             share the canonical components/chapter sources; the compiler scopes
             each instance so landscape cards and openers can coexist.

             Framing does no work here, which is the real difference from the
             vertical twin. A 1920x1080 source covering a 1920x1080 frame scales
             1:1 with no overflow on either axis, so `cover` crops nothing and
             cameraPosition has nothing to place — it stays declared so the two
             talking-head blocks take the same variables and the edit stage can
             assign either without special-casing, but a wrong value here is
             inert rather than cropping the speaker out of frame. */
          .thh-camera {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            object-position: var(--cameraPosition, center);
            z-index: 0;
          }
          /* Chapter opener — same beats, easing and treatment as the portrait
             pair, so a chapter reads the same however its template was assigned.
             Untimed: the framework owns .clip visibility, and this has to animate
             out. The defocus is the canonical `effects.blur` shader on the
             camera, resolving to identity as the plate leaves — not a CSS
             filter. */
          .thh-open {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            z-index: 5;
          }
          /* The light chapter surface shares the card typography and exits
             with the existing plate motion. */
          /* chapter-style:start */
          /* Shared chapter typography. Embedded into each template by sync-chapters.mjs;
             no stylesheet fetch is required in generated render workspaces.
             Figma: "Video Layouts and Thumbnails", Chapter Card section (node 67:987).
             Defaults are the landscape card; portrait templates override the sizes. */
          .chapter-heading {
            box-sizing: border-box;
            width: 100%;
            max-width: var(--chapter-width, 1000px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--chapter-gap, 33px);
            text-align: left;
            color: var(--chapter-text, var(--saaga-ink));
          }
          /* CHAPTER over the number, centred on it, the pair left-aligned as a block. */
          .chapter-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--chapter-meta-gap, 16px);
          }
          .chapter-label {
            color: var(--chapter-muted, #555554);
            font-size: var(--chapter-label-size, 41px);
            font-weight: 500;
            line-height: normal;
            text-transform: uppercase;
            overflow-wrap: anywhere;
          }
          .chapter-number {
            color: var(--chapter-accent, var(--saaga-orange));
            font-size: var(--chapter-number-size, 188px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.11;
            white-space: nowrap;
          }
          .chapter-signature {
            display: block;
            width: var(--chapter-rule-width, 392px);
            max-width: 100%;
          }
          .chapter-rule {
            display: block;
            width: 100%;
            height: var(--chapter-rule-weight, 2px);
            background: var(--chapter-accent, var(--saaga-orange));
            transform-origin: left center;
          }
          .chapter-topic {
            margin: 0;
            max-width: 100%;
            color: var(--chapter-text, var(--saaga-ink));
            font-size: var(--chapter-title-size, 107px);
            font-weight: 700;
            line-height: 1.11;
            overflow-wrap: anywhere;
            text-wrap: balance;
          }
          .chapter-topic:empty { display: none; }
          /* The chapter surface shared by the footage openers: the card's own layout,
             on the orientation's surface. The existing plate exit carries the surface
             and its type away together. */
          .chapter-heading.chapter-opener {
            max-width: none;
            height: 100%;
            padding: var(--chapter-padding, 0 0 154px 122px);
            justify-content: center;
            background: var(--chapter-surface, #fdeee6);
          }
          .chapter-heading.chapter-opener > * { max-width: var(--chapter-width, 1000px); }
          /* The outline card's heading (Figma "Topic Card", option 2): the number and
             label in one orange-outlined pill, then the title with a short rule under
             it. Flex order puts the rule after the title without a second markup. */
          .chapter-heading.chapter-pill { gap: 0; }
          .chapter-pill .chapter-meta {
            flex-direction: row-reverse;
            gap: var(--chapter-pill-gap, 16px);
            padding: 0 var(--chapter-pill-pad, 28px);
            border: var(--chapter-pill-border, 1px) solid var(--chapter-accent, var(--saaga-orange));
            border-radius: 999px;
            margin-bottom: var(--chapter-pill-after, 58px);
          }
          .chapter-pill .chapter-label {
            font-size: var(--chapter-label-size, 45px);
            font-weight: 600;
          }
          .chapter-pill .chapter-number {
            font-size: var(--chapter-number-size, 65px);
            font-weight: 600;
            line-height: normal;
          }
          .chapter-pill .chapter-topic { order: 1; }
          .chapter-pill .chapter-signature {
            order: 2;
            width: var(--chapter-rule-width, 215px);
            margin-top: var(--chapter-rule-before, 22px);
          }
          /* chapter-style:end */
        </style>

        <video style="--hf-color-grading-blur: 0.8; --hf-color-grading-exposure: -0.7" data-color-grading='{"adjust":{"exposure":-0.7},"effects":{"blur":0.8}}' data-hf-id="hf-thhcm" id="thh-camera-video" class="thh-camera clip" data-start="0" data-duration="10" data-track-index="0" data-var-src="cameraSrc" src="assets/placeholder-camera.mp4" muted playsinline></video>

        <!-- Audio is always its own element, even pointing at the same file as the
             video. The authored src must stay a real file — render-time audio
             extraction needs something valid to parse (lint:
             media_variable_src_no_fallback) — but audioSrc does override it.
             Without this the render has no audio stream at all, which the
             screencast render stage rejects outright. -->
        <audio data-hf-id="hf-thhaud" id="thh-audio" data-start="0" data-duration="10" data-track-index="9" data-var-src="audioSrc" src="assets/placeholder-audio.mp3" data-volume="1"></audio>

        <div data-hf-id="hf-thhopen" id="thh-opener" class="thh-open">
          <div data-hf-id="hf-thhopl" id="thh-opener-plate" class="chapter-heading chapter-opener">
            <div id="thh-opener-meta" class="chapter-meta">
              <div data-hf-id="hf-thhoplb" id="thh-opener-label" class="chapter-label" data-var-text="chapterLabel">Chapter</div>
              <div data-hf-id="hf-thhopnm" id="thh-opener-number" class="chapter-number" data-var-text="chapterNumber">01</div>
            </div>
            <div data-hf-id="hf-thhoprl" id="thh-opener-rule" class="chapter-signature" aria-hidden="true">
              <span data-hf-id="hf-thhoprll" id="thh-opener-rule-left" class="chapter-rule"></span>
            </div>
            <div data-hf-id="hf-thhoptp" id="thh-opener-topic" class="chapter-topic" data-var-text="chapterTopic">The New Workflow</div>
          </div>
        </div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });
            /* chapter-motion:start */
            /* Embedded inside each template's IIFE; no globals or extra timelines.
               Selectors are passed explicitly so instances keep their own scoped targets. */
            function addChapterMotion(tl, options) {
              var elements = [options.meta, options.title, options.signature];
              if (options.animateIn) {
                // Even a one-second card completes its entrance with time left to read.
                var beat = Math.min(1, options.duration / 1.8);
                tl.fromTo(options.meta,
                  { autoAlpha: 0, y: 14 },
                  { autoAlpha: 1, y: 0, duration: 0.36 * beat, ease: 'power3.out' },
                  0.04 * beat);
                // The rule sits between the number and the title, so it draws first and
                // the title rises in beneath it.
                tl.fromTo(options.signature,
                  { autoAlpha: 0, y: 0 },
                  { autoAlpha: 1, y: 0, duration: 0.3 * beat, ease: 'power2.out' },
                  0.12 * beat);
                tl.fromTo(options.rule,
                  { scaleX: 0 },
                  { scaleX: 1, duration: 0.48 * beat, ease: 'power3.out' },
                  0.12 * beat);
                tl.fromTo(options.title,
                  { autoAlpha: 0, y: 28 },
                  { autoAlpha: 1, y: 0, duration: 0.5 * beat, ease: 'power3.out' },
                  0.2 * beat);
              } else {
                // Footage openers and holdFromStart cards remain readable in frame zero.
                tl.set(elements, { autoAlpha: 1, y: 0 }, 0);
                tl.set(options.rule, { scaleX: 1 }, 0);
              }
              if (typeof options.exitAt === 'number') {
                tl.fromTo(options.plate,
                  { autoAlpha: 1, y: 0 },
                  { autoAlpha: 0, y: -24, duration: options.exitDuration,
                    ease: 'power2.in', immediateRender: false },
                  options.exitAt);
              }
            }
            /* chapter-motion:end */
            var vars = (window.__hyperframes && window.__hyperframes.getVariables)
              ? window.__hyperframes.getVariables() : {};

            /* Chapter length. Every timed element takes it, or that element's
               hardcoded duration ends its clip early and the frame goes blank
               partway through a longer chapter. Resolves per instance from the
               host slot's data-variable-values. */
            var D = Number(vars.durationSeconds);
            if (!isFinite(D) || D < 1 || D > 900) { D = 10; }
            ['thh-camera-video', 'thh-audio'].forEach(function (id) {
              var el = document.getElementById(id);
              if (el) { el.setAttribute('data-duration', String(D)); }
            });

            /* ---- Chapter opener -------------------------------------------
               Same beats and same easing as talking-head-vertical and
               screen-camera-vertical, so a chapter opens identically whichever
               template the edit assigned it. The plate lifts away while
               `effects.blur` returns to identity, pulling the camera into focus
               on the same beat. */
            var OPEN = Number(vars.openerSeconds);
            if (!isFinite(OPEN) || OPEN < 1.2 || OPEN > 6) { OPEN = 2.6; }

            /* The title is NOT animated on. It is fully composed in frame one —
               plate, label, number, rule and topic all at rest — holds for the
               opener, then leaves. Nothing here sets an entrance state, so the
               CSS is the first frame and a seek to 0 shows the finished title.

               openerSeconds therefore means "how long the title holds", and the
               exit plus the blur ramp are clamped to finish inside the chapter so
               a short one is never left mid-fade or permanently defocused. */
            var HOLD = Math.max(0.2, Math.min(OPEN, D));
            var EXIT_DUR = Math.min(0.42, Math.max(0.15, D * 0.2));
            var RAMP = 0.85;
            var EXIT = Math.min(HOLD, Math.max(0, D - EXIT_DUR));
            var ramp = Math.max(0.2, Math.min(RAMP, D - EXIT));

            addChapterMotion(tl, {
              duration: D,
              animateIn: false,
              meta: '#thh-opener-meta',
              title: '#thh-opener-topic',
              signature: '#thh-opener-rule',
              rule: '#thh-opener-rule-left',
              plate: '#thh-opener-plate',
              exitAt: EXIT,
              exitDuration: EXIT_DUR
            });
            tl.to('#thh-camera-video', { '--hf-color-grading-blur': 0, duration: ramp, ease: 'power2.out' }, EXIT);
            tl.to('#thh-camera-video', { '--hf-color-grading-exposure': 0, duration: ramp, ease: 'power2.out' }, EXIT);

            window.__timelines['talking-head-horizontal'] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
