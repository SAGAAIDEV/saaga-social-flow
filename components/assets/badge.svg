    <style>
        @keyframes rotate-small {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-medium {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes rotate-dashed-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-dashed-self {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        #circle-small {
            transform-origin: 10.07px 10.07px;
            animation: rotate-small 4s linear infinite;
        }
        #circle-medium {
            transform-origin: 10.07px 10.07px;
            animation: rotate-medium 4s linear infinite;
        }
        #dashed-orbit {
            transform-origin: 10.07px 10.07px;
            animation: rotate-dashed-orbit 8s linear infinite;
        }
        #circle-dashed {
            transform-origin: 7.3px 11px;
            animation: rotate-dashed-self 5s linear infinite;
        }
    </style>
