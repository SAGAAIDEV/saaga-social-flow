{% extends "base.html" %}
{% block content %}
<style>
  .clips { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .clip { background: #16181c; border: 1px solid #262a31; border-radius: 8px; padding: 10px; }
  /* Sized by shape: a vertical in a widescreen box is mostly letterbox, and the
     edges are where a bad render shows first. */
  .clip.landscape { width: 520px; }
  .clip.portrait { width: 260px; }
  .clip video { width: 100%; border-radius: 4px; background: #000; display: block; }
  .meta { display: flex; justify-content: space-between; gap: 8px;
          margin-top: 7px; font-size: 12px; color: #98a2b3; }
  .meta .name { color: #e6e9ef; font-weight: 600; }
</style>

<h1>Review</h1>
<div class="sub">What Distribute is about to upload. Scrub before you send it.</div>

{% if blocked %}
  <p class="empty">{{ blocked }}</p>
{% else %}
<div class="clips">
  {% for clip in clips %}
  <div class="clip {{ clip.orientation }}">
    <video src="{{ clip.url }}" controls preload="metadata" playsinline></video>
    <div class="meta">
      <span class="name">{{ clip.label }}</span>
      <span data-duration-for="{{ clip.id }}">{{ "%.1f"|format(clip.megabytes) }} MB</span>
    </div>
  </div>
  {% endfor %}
</div>

<script>
  // Duration comes from the file itself once the browser has read its header —
  // cheaper and more honest than shelling out to ffprobe on every repaint.
  document.querySelectorAll('.clip').forEach(function (card) {
    const video = card.querySelector('video');
    const meta = card.querySelector('[data-duration-for]');
    if (!video || !meta) return;
    const size = meta.textContent;
    video.addEventListener('loadedmetadata', function () {
      const total = Math.round(video.duration);
      const mins = Math.floor(total / 60);
      const secs = String(total % 60).padStart(2, '0');
      meta.textContent = mins + ':' + secs + ' · ' + size;
    });
  });
</script>
{% endif %}
{% endblock %}
